# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Key
app.jwt.secret======================JWTSecretKey=====================
app.jwt.expiration-ms=86400000 # 24 hours

# Application Specific Settings
# Office location (Latitude, Longitude) for proximity check
office.location.latitude=29.3759
office.location.longitude=47.9774
# Maximum allowed distance from office in meters
office.location.proximity-radius=500

# Payroll Settings
payroll.standard-daily-hours=8.0
payroll.hourly-rate=10.0 # Standard hourly rate
payroll.overtime-rate-multiplier=1.5 # Regular overtime
payroll.weekend-rate-multiplier=2.0 # Weekend overtime
payroll.holiday-rate-multiplier=2.5 # Public holiday overtime